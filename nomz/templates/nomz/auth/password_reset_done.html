{% extends 'nomz/base.html' %}
{% block title %}Check Your Email — nomz{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-header">
        <a href="/" class="auth-logo">nomz</a>
        <span class="auth-header-rule"></span>
        <span class="auth-header-label">Email Sent</span>
    </div>
    <div class="auth-body">
        <div class="auth-card" style="text-align:center;">
            <div class="auth-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <h1 class="auth-title">Check Your Email</h1>
            <p class="auth-sub">Reset link sent</p>
            <p style="font-size:14px;color:var(--mid);line-height:1.6;margin-bottom:8px;">We've sent a password reset link to your email address.</p>
            <p style="font-size:12px;color:var(--mid);font-style:italic;margin-bottom:32px;">If you don't see it, check your spam folder.</p>
            <a href="/signin/" class="btn btn-primary">Back to Sign In</a>
        </div>
    </div>
</div>
<style>
.auth-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
.auth-header { display: flex; align-items: center; gap: 20px; padding: 20px 6vw; border-bottom: 2px solid var(--ink); }
.auth-logo { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 900; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; flex-shrink: 0; }
.auth-header-rule { flex: 1; height: 1px; background: var(--rule); }
.auth-header-label { font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--mid); flex-shrink: 0; }
.auth-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 6vw; }
.auth-card { width: 100%; max-width: 420px; border: 1px solid var(--rule); padding: 48px 40px; background: var(--paper); }
.auth-icon { width: 64px; height: 64px; border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; color: var(--tan); }
.auth-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 900; color: var(--ink); margin-bottom: 6px; }
.auth-sub { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid); margin-bottom: 20px; }
</style>
{% endblock %}
