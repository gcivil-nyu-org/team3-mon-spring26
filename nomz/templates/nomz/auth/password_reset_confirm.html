{% extends 'nomz/base.html' %}
{% load static %}
{% block title %}Set New Password — nomz{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-header">
        <a href="/" class="auth-logo">nomz</a>
        <span class="auth-header-rule"></span>
        <span class="auth-header-label">New Password</span>
    </div>
    <div class="auth-body">
        <div class="auth-card">
            <h1 class="auth-title">Set New Password</h1>
            <p class="auth-sub">Choose a strong password to secure your account</p>
            <p id="confirm-error" class="auth-error" style="display:none;"></p>
            <form id="confirm-form" class="auth-form">
                <div class="auth-field">
                    <label for="password1">New Password</label>
                    <input type="password" id="password1" name="password1" placeholder="new password" required>
                </div>
                <div class="auth-field">
                    <label for="password2">Confirm Password</label>
                    <input type="password" id="password2" name="password2" placeholder="confirm password" required>
                </div>
                <button type="submit" id="confirm-submit" class="btn btn-primary w-full">Reset Password</button>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('confirm-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd1 = document.getElementById('password1').value;
    const pwd2 = document.getElementById('password2').value;
    const btn = document.getElementById('confirm-submit');
    const errorDisplay = document.getElementById('confirm-error');
    errorDisplay.style.display = 'none';
    if (pwd1 !== pwd2) { errorDisplay.textContent = 'Passwords do not match.'; errorDisplay.style.display = 'block'; return; }
    if (pwd1.length < 8) { errorDisplay.textContent = 'Password must be at least 8 characters.'; errorDisplay.style.display = 'block'; return; }
    btn.disabled = true;
    btn.textContent = 'Resetting…';
    const params = new URLSearchParams(window.location.search);
    try {
        const r = await apiFetch('/api/auth/password-reset/confirm/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ uidb64: params.get('uid'), token: params.get('token'), new_password1: pwd1, new_password2: pwd2 })
        });
        if (r.ok) { window.location.href = '/password-reset/complete/'; }
        else { errorDisplay.textContent = 'Failed to reset password. The link may be invalid or expired.'; errorDisplay.style.display = 'block'; }
    } catch { errorDisplay.textContent = 'Network error. Please try again.'; errorDisplay.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = 'Reset Password'; }
});
</script>

<style>
.auth-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
.auth-header { display: flex; align-items: center; gap: 20px; padding: 20px 6vw; border-bottom: 2px solid var(--ink); }
.auth-logo { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 900; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; flex-shrink: 0; }
.auth-header-rule { flex: 1; height: 1px; background: var(--rule); }
.auth-header-label { font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--mid); flex-shrink: 0; }
.auth-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 6vw; }
.auth-card { width: 100%; max-width: 420px; border: 1px solid var(--rule); padding: 40px; background: var(--paper); }
.auth-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 900; color: var(--ink); margin-bottom: 6px; }
.auth-sub { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid); margin-bottom: 28px; }
.auth-error { background: rgba(212,43,43,0.06); color: var(--red); border-left: 3px solid var(--red); padding: 10px 14px; font-size: 13px; margin-bottom: 20px; }
.auth-form { display: flex; flex-direction: column; gap: 18px; }
.auth-field { display: flex; flex-direction: column; gap: 6px; }
.auth-field label { font-size: 10px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--mid); }
.auth-field input { border: 1px solid var(--rule); background: var(--paper); padding: 12px 14px; font-family: var(--font-sans); font-size: 14px; color: var(--ink); width: 100%; transition: border-color 0.2s; }
.auth-field input:focus { outline: none; border-color: var(--ink); }
</style>
{% endblock %}
