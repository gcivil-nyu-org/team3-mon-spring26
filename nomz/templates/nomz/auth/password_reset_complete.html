{% extends 'nomz/base.html' %}
{% block title %}Password Reset Complete — nomz{% endblock %}
{% block main_layout %}
<style>
    nav.navbar, body > footer { display: none !important; }
    body { background: var(--paper); }
</style>
<div class="auth-page">
    <div class="auth-header">
        <a href="/" class="auth-logo">nomz</a>
        <span class="auth-header-rule"></span>
        <span class="auth-header-label">Reset Complete</span>
    </div>
    <div class="auth-body">
        <div class="auth-card" style="text-align:center;">
            <div class="auth-icon" style="color:var(--red);">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <h1 class="auth-title">Password Reset</h1>
            <p class="auth-sub" style="margin-bottom:16px;">Your password has been successfully reset</p>
            <p style="font-size:14px;color:var(--mid);line-height:1.6;margin-bottom:32px;">You can now sign in with your new password.</p>
            <a href="/signin/" class="btn btn-primary">Sign In</a>
        </div>
    </div>
</div>
<style>
.auth-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
.auth-header { display: flex; align-items: center; gap: 20px; padding: 20px 6vw; border-bottom: 2px solid var(--ink); }
.auth-logo { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 900; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; flex-shrink: 0; }
.auth-header-rule { flex: 1; height: 1px; background: var(--rule); }
.auth-header-label { font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--mid); flex-shrink: 0; }
.auth-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 6vw; }
.auth-card { width: 100%; max-width: 420px; border: 1px solid var(--rule); padding: 48px 40px; background: var(--paper); }
.auth-icon { width: 64px; height: 64px; border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
.auth-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 900; color: var(--ink); margin-bottom: 6px; }
.auth-sub { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid); }
</style>
{% endblock %}
