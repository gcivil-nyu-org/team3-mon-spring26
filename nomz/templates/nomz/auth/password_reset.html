{% extends 'nomz/base.html' %}
{% load static %}
{% block title %}Reset Password — nomz{% endblock %}

{% block main_layout %}
<style>
    nav.navbar, body > footer { display: none !important; }
    body { background: var(--paper); }
</style>
<div class="auth-page">
    <div class="auth-header">
        <a href="/" class="auth-logo">nomz</a>
        <span class="auth-header-rule"></span>
        <span class="auth-header-label">Password Reset</span>
    </div>
    <div class="auth-body">
        <button onclick="window.location.href='/signin/'" class="auth-back">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Sign In
        </button>
        <div class="auth-card">
            <h1 class="auth-title">Reset Your Password</h1>
            <p class="auth-sub">Enter your email and we'll send a reset link</p>
            <p id="reset-error" class="auth-error" style="display:none;"></p>
            <form id="reset-form" class="auth-form">
                <div class="auth-field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <button type="submit" id="reset-submit" class="btn btn-primary w-full">Send Reset Link</button>
            </form>
            <p class="auth-footer-text">Remember your password? <a href="/signin/" class="auth-link">Sign in</a></p>
        </div>
    </div>
</div>

<script>
document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const btn = document.getElementById('reset-submit');
    const errorDisplay = document.getElementById('reset-error');
    errorDisplay.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Sending…';
    try {
        const r = await apiFetch('/api/auth/password-reset/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email})
        });
        if (r.ok) { window.location.href = '/password-reset/done/'; }
        else { errorDisplay.textContent = 'Failed to send reset email. Check your email address.'; errorDisplay.style.display = 'block'; }
    } catch { errorDisplay.textContent = 'Network error. Please try again.'; errorDisplay.style.display = 'block'; }
    finally { btn.disabled = false; btn.textContent = 'Send Reset Link'; }
});
</script>

<style>
.auth-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
.auth-header { display: flex; align-items: center; gap: 20px; padding: 20px 6vw; border-bottom: 2px solid var(--ink); }
.auth-logo { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 900; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; flex-shrink: 0; }
.auth-header-rule { flex: 1; height: 1px; background: var(--rule); }
.auth-header-label { font-size: 10px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--mid); flex-shrink: 0; }
.auth-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 6vw; position: relative; }
.auth-back { position: absolute; top: 32px; left: 6vw; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none; cursor: pointer; font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mid); transition: color 0.2s; padding: 0; }
.auth-back:hover { color: var(--ink); }
.auth-card { width: 100%; max-width: 420px; border: 1px solid var(--rule); padding: 40px; background: var(--paper); }
.auth-title { font-family: var(--font-serif); font-size: 2rem; font-weight: 900; color: var(--ink); margin-bottom: 6px; }
.auth-sub { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid); margin-bottom: 28px; }
.auth-error { background: rgba(212,43,43,0.06); color: var(--red); border-left: 3px solid var(--red); padding: 10px 14px; font-size: 13px; margin-bottom: 20px; }
.auth-form { display: flex; flex-direction: column; gap: 18px; }
.auth-field { display: flex; flex-direction: column; gap: 6px; }
.auth-field label { font-size: 10px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--mid); }
.auth-field input { border: 1px solid var(--rule); background: var(--paper); padding: 12px 14px; font-family: var(--font-sans); font-size: 14px; color: var(--ink); width: 100%; transition: border-color 0.2s; }
.auth-field input:focus { outline: none; border-color: var(--ink); }
.auth-footer-text { margin-top: 24px; font-size: 13px; color: var(--mid); text-align: center; }
.auth-link { color: var(--red); border-bottom: 1px solid currentColor; }
.auth-link:hover { opacity: 0.75; }
</style>
{% endblock %}
