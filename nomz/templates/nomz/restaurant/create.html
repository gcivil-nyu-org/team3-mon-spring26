{% extends 'nomz/base.html' %}
{% block main_layout %}
{% include 'nomz/components/premium_design.html' %}
<style>
    nav.navbar, body > footer { display: none !important; }
    .rest-container { max-width: 600px; margin: 0 auto; padding: 4rem 2rem; position: relative; z-index: 10; }
    .rest-title { font-family: var(--font-sans); font-size: 32px; font-weight: 700; color: var(--red); margin-bottom: 2rem; text-align: center; }
    .glass-card { 
        background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(212, 43, 43, 0.15);
        border-radius: 24px; padding: 2.5rem; box-shadow: 0 8px 32px rgba(212, 43, 43, 0.08);
    }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; font-size: 14px; font-weight: 600; color: #444; margin-bottom: 0.5rem; }
    .form-input {
        width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(212, 43, 43, 0.2);
        background: rgba(255, 255, 255, 0.8); font-size: 15px; outline: none; transition: all 0.2s;
    }
    .form-input:focus { border-color: var(--red); box-shadow: 0 0 0 4px rgba(212, 43, 43, 0.1); }
    .ad-btn { 
        width: 100%; padding: 14px; border-radius: 100px; font-weight: 700; cursor: pointer; transition: all 0.3s; border: none; font-family: var(--font-sans);
        background: var(--red); color: white; margin-top: 1rem; box-shadow: 0 4px 12px rgba(212, 43, 43, 0.3);
    }
    .ad-btn:hover { background: #b82020; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 43, 43, 0.4); }
</style>

<div class="rest-container">
    {% include 'nomz/components/premium_nav.html' %}
    <h1 class="rest-title" style="margin-top: 2rem;">Register Your Business</h1>
    <div class="glass-card">
        <form id="form">
            <div class="form-group">
                <label class="form-label">Business Name</label>
                <input id="name" class="form-input" placeholder="e.g. The Italian Kitchen" required/>
            </div>
            <div class="form-group">
                <label class="form-label">Address</label>
                <input id="address" class="form-input" placeholder="123 Foodie St, New York, NY" required/>
            </div>
            <div class="form-group">
                <label class="form-label">Cuisine Type</label>
                <input id="cuisine" class="form-input" placeholder="e.g. Italian, Sushi, Vegan"/>
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input id="phone" class="form-input" placeholder="Optional"/>
            </div>
            <button type="submit" id="submit-btn" class="ad-btn">Create Business Profile</button>
        </form>
    </div>
</div>

<script>
document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Creating...';
    
    try {
        await apiFetch('/api/restaurant/create/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                address: document.getElementById('address').value,
                cuisine: document.getElementById('cuisine').value,
                phone: document.getElementById('phone').value
            })
        });
        location.href = '/restaurant-profile/';
    } catch (err) {
        alert('Error creating restaurant. Please check your inputs.');
        btn.disabled = false; btn.textContent = 'Create Business Profile';
    }
});
</script>
{% endblock %}
