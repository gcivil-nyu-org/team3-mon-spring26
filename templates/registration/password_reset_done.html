{% extends 'nomz/base.html' %}

{% block title %}Check your email - Nomz{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-header">
            <h2>Check your email</h2>
        </div>
        <div class="card-body">
            <p class="mb-0">If an account exists with that email, you will receive a password reset link shortly. Check your spam folder if you don't see it.</p>
            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
