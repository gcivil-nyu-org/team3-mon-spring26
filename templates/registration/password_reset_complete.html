{% extends 'nomz/base.html' %}

{% block title %}Password reset complete - Nomz{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-header">
            <h2>Password reset complete</h2>
        </div>
        <div class="card-body">
            <p class="mb-0">Your password has been set. You can now log in with your new password.</p>
            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="btn btn-primary">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
