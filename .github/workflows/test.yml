name: Test on Develop Branch

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_nomz_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Create test environment file
        run: |
          cat > .env << EOF
          DEBUG=True
          SECRET_KEY=test-secret-key-for-ci-cd
          ALLOWED_HOSTS=localhost,127.0.0.1,testserver
          DB_ENGINE=django.db.backends.postgresql
          DB_NAME=test_nomz_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          USE_S3=False
          ENVIRONMENT=testing
          EOF

      - name: Run migrations
        run: |
          python manage.py migrate --no-input

      - name: Run Django tests
        run: |
          python manage.py test --no-input --verbosity=2

      - name: Check for migrations
        run: |
          python manage.py makemigrations --dry-run --check

      - name: Collect static files
        run: |
          python manage.py collectstatic --noinput --dry-run

      - name: Test import statements
        run: |
          python -c "import django; django.setup(); from nomz import models, views, forms"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            coverage.xml
            test_results.json

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: Check code formatting with black
        run: black --check --diff .
        continue-on-error: true

      - name: Check import ordering with isort
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-code is 0 even if there are warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true
